<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="spaceVoid" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#101432"/>
      <stop offset="35%" stop-color="#080a1c"/>
      <stop offset="70%" stop-color="#04050e"/>
      <stop offset="100%" stop-color="#020206"/>
    </radialGradient>

    <!-- Nebulae Gradients -->
    <radialGradient id="orangeNebula" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff6600" stop-opacity="0.65"/>
      <stop offset="40%" stop-color="#ff2255" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#880055" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleNebula" cx="20%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#aa00ff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#6600cc" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#220066" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#3b1464" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Earth Gradients -->
    <radialGradient id="earthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#000" stop-opacity="0"/>
      <stop offset="95%" stop-color="#4fc3f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00b0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="earthOcean" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#64b5f6"/>
      <stop offset="45%" stop-color="#1976d2"/>
      <stop offset="80%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#062354"/>
    </radialGradient>

    <!-- Mascot Gradients -->
    <linearGradient id="jellyBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#99ff33"/>
      <stop offset="45%" stop-color="#4cd924"/>
      <stop offset="85%" stop-color="#269b12"/>
      <stop offset="100%" stop-color="#156608"/>
    </linearGradient>
    <radialGradient id="jellyHighlight" cx="35%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#ccff66" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4cd924" stop-opacity="0"/>
    </radialGradient>

    <!-- Comic Rush Title Gradients -->
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40e0d0"/>
      <stop offset="30%" stop-color="#00bfff"/>
      <stop offset="70%" stop-color="#9370db"/>
      <stop offset="100%" stop-color="#ba55d3"/>
    </linearGradient>
    <linearGradient id="rushGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="35%" stop-color="#ff9900"/>
      <stop offset="75%" stop-color="#ff2200"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnParchment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde4bb"/>
      <stop offset="50%" stop-color="#fccf89"/>
      <stop offset="100%" stop-color="#f4b563"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Space Background -->
  <rect width="1280" height="720" fill="url(#spaceVoid)"/>
  <rect width="1280" height="720" fill="url(#orangeNebula)"/>
  <rect width="1280" height="720" fill="url(#purpleNebula)"/>
  <rect width="1280" height="720" fill="url(#centerGlow)"/>

  <!-- Speed streaks -->
  <g stroke="rgba(255,255,255,0.22)" stroke-width="1.5" stroke-linecap="round">
    <line x1="120" y1="100" x2="30" y2="40" />
    <line x1="220" y1="80" x2="160" y2="30" />
    <line x1="60" y1="320" x2="0" y2="340" />
    <line x1="850" y1="110" x2="1020" y2="70" />
    <line x1="940" y1="260" x2="1120" y2="230" />
    <line x1="780" y1="620" x2="920" y2="690" />
    <line x1="450" y1="660" x2="390" y2="710" />
    <line x1="1200" y1="450" x2="1270" y2="460" />
    <line x1="1150" y1="550" x2="1240" y2="570" />
  </g>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="90" r="1.5"/>
    <circle cx="140" cy="180" r="1.2"/>
    <circle cx="220" cy="240" r="1.8"/>
    <circle cx="280" cy="110" r="1.4"/>
    <circle cx="110" cy="420" r="1.6"/>
    <circle cx="190" cy="490" r="1.3"/>
    <circle cx="260" cy="620" r="1.5"/>
    <circle cx="450" cy="140" r="2"/>
    <circle cx="520" cy="80" r="1.4"/>
    <circle cx="670" cy="120" r="1.6"/>
    <circle cx="740" cy="190" r="1.8"/>
    <circle cx="820" cy="150" r="1.2"/>
    <circle cx="900" cy="90" r="1.5"/>
    <circle cx="1120" cy="140" r="1.3"/>
    <circle cx="1230" cy="190" r="1.7"/>
    <circle cx="750" cy="380" r="1.4"/>
    <circle cx="850" cy="420" r="1.6"/>
    <circle cx="1050" cy="350" r="1.5"/>
    <circle cx="1210" cy="380" r="1.8"/>
    <circle cx="680" cy="650" r="1.5"/>
    <circle cx="750" cy="680" r="1.3"/>
    <circle cx="420" cy="620" r="1.7"/>
    <circle cx="360" cy="680" r="1.2"/>
  </g>

  <!-- Big 4-pointed radiant starbursts -->
  <g transform="translate(225, 520)">
    <ellipse rx="75" ry="3" fill="#ffffff" opacity="0.9"/>
    <ellipse rx="3" ry="75" fill="#ffffff" opacity="0.9"/>
    <ellipse rx="35" ry="35" fill="#00ffff" opacity="0.35" filter="url(#glowFilter)"/>
    <circle r="7" fill="#ffffff"/>
    <circle r="12" fill="#00ffff" opacity="0.6"/>
  </g>
  <g transform="translate(70, 220)">
    <ellipse rx="35" ry="2" fill="#ffffff" opacity="0.8"/>
    <ellipse rx="2" ry="35" fill="#ffffff" opacity="0.8"/>
    <circle r="4" fill="#ffffff"/>
  </g>
  <g transform="translate(720, 80)">
    <ellipse rx="40" ry="2" fill="#ffffff" opacity="0.75"/>
    <ellipse rx="2" ry="40" fill="#ffffff" opacity="0.75"/>
    <circle r="4" fill="#ffffff"/>
  </g>

  <!-- Asteroids -->
  <!-- Asteroid 1 (upper left) -->
  <polygon points="145,185 158,192 165,210 155,225 140,222 132,208 135,193" fill="#4a4055" stroke="#261f2e" stroke-width="2"/>
  <polygon points="145,188 152,192 148,202 138,198" fill="#6d617c" opacity="0.6"/>

  <!-- Asteroid 2 (lower left) -->
  <polygon points="145,510 158,520 162,535 152,548 138,545 132,530 135,515" fill="#42394c" stroke="#221d27" stroke-width="2"/>

  <!-- Asteroid 3 (mid right) -->
  <polygon points="790,240 812,246 825,268 815,285 795,282 782,265 785,248" fill="#4f425c" stroke="#251d2d" stroke-width="2"/>

  <!-- Asteroid 4 (lower right) -->
  <polygon points="720,685 745,695 758,720 740,735 715,730 705,710 710,690" fill="#3d3447" stroke="#1c1822" stroke-width="2"/>

  <!-- Earth (Upper left-center) -->
  <g transform="translate(345, 155)">
    <!-- Atmosphere halo -->
    <circle r="82" fill="url(#earthGlow)"/>
    <!-- Globe -->
    <circle r="75" fill="url(#earthOcean)"/>
    <!-- Continents -->
    <path d="M -30,-45 Q -10,-55 20,-40 Q 40,-30 45,-10 Q 50,15 30,25 Q 10,35 -5,20 Q -25,25 -40,5 Q -55,-15 -30,-45 Z" fill="#43a047" opacity="0.85"/>
    <path d="M 10,0 Q 25,-15 45,5 Q 35,40 10,50 Q -5,35 10,0 Z" fill="#2e7d32" opacity="0.8"/>
    <path d="M -50,-20 Q -35,-10 -30,10 Q -45,30 -60,15 Q -65,-5 -50,-20 Z" fill="#388e3c" opacity="0.75"/>
    <!-- Cloud Swirls -->
    <path d="M -60,-35 Q -20,-48 30,-30 Q 60,-15 50,5" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
    <path d="M -45,10 Q -10,-5 35,18 Q 50,30 20,45" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <path d="M -20,35 Q 15,48 45,35" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <circle r="75" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  </g>

  <!-- Green particle ribbon/trail from Earth to Mascot -->
  <path d="M 330,190 C 270,300 240,420 330,500 C 390,550 480,560 550,570" fill="none" stroke="#00e676" stroke-width="8" stroke-linecap="round" opacity="0.7" filter="url(#glowFilter)"/>
  <path d="M 320,185 C 250,320 250,440 350,510 C 420,560 500,565 570,580" fill="none" stroke="#76ff03" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M 345,195 C 285,310 270,410 360,480 C 430,530 510,550 580,575" fill="none" stroke="#ccff90" stroke-width="2" opacity="0.9"/>
  <!-- Sparkles on trail -->
  <g fill="#b9f6ca">
    <circle cx="270" cy="340" r="3.5"/>
    <circle cx="260" cy="410" r="4"/>
    <circle cx="290" cy="460" r="3"/>
    <circle cx="340" cy="505" r="4.5"/>
    <circle cx="420" cy="545" r="4"/>
    <circle cx="490" cy="565" r="3.5"/>
  </g>

  <!-- Mascot (Green Jelly Medusa/Alien) in Center Bottom -->
  <g transform="translate(585, 590)">
    <!-- Green outer glow aura -->
    <ellipse cx="0" cy="-35" rx="110" ry="95" fill="#00e676" opacity="0.35" filter="url(#glowFilter)"/>
    
    <!-- Antenna -->
    <path d="M 0,-115 Q 10,-135 15,-155" fill="none" stroke="#52e022" stroke-width="8" stroke-linecap="round"/>
    <circle cx="15" cy="-158" r="13" fill="#99ff33" filter="url(#glowFilter)"/>
    <circle cx="15" cy="-158" r="8" fill="#ffffff"/>

    <!-- Tentacles (6 tentacles trailing below) -->
    <path d="M -65,30 Q -85,65 -95,95 Q -98,110 -85,112 Q -72,110 -70,90 Q -65,60 -50,35 Z" fill="#38b815" stroke="#1b6807" stroke-width="3"/>
    <path d="M -40,40 Q -55,80 -60,115 Q -60,130 -48,130 Q -38,125 -40,105 Q -38,70 -25,42 Z" fill="#45c91b" stroke="#1b6807" stroke-width="3"/>
    <path d="M -15,45 Q -20,95 -18,130 Q -15,145 -3,142 Q 8,135 5,115 Q 3,80 5,45 Z" fill="#52d922" stroke="#1b6807" stroke-width="3"/>
    <path d="M 15,45 Q 25,95 32,130 Q 38,145 48,140 Q 56,132 50,112 Q 40,80 32,45 Z" fill="#52d922" stroke="#1b6807" stroke-width="3"/>
    <path d="M 42,40 Q 62,80 75,115 Q 82,128 92,122 Q 98,112 90,95 Q 78,70 58,38 Z" fill="#45c91b" stroke="#1b6807" stroke-width="3"/>
    <path d="M 65,30 Q 95,65 110,95 Q 118,108 128,102 Q 132,92 120,78 Q 100,55 78,28 Z" fill="#38b815" stroke="#1b6807" stroke-width="3"/>

    <!-- Main Head / Body (Rounded Jelly Cube) -->
    <rect x="-90" y="-120" width="180" height="165" rx="55" fill="url(#jellyBody)" stroke="#1e7e0b" stroke-width="5"/>
    <!-- Specular Highlight Top-Left -->
    <path d="M -70,-100 Q -30,-115 25,-115 Q -10,-95 -45,-75 Q -68,-85 -70,-100 Z" fill="#ffffff" opacity="0.55"/>

    <!-- Visor Goggles Frame (Silver/Tech Rim) -->
    <rect x="-78" y="-65" width="156" height="82" rx="38" fill="#e0e8f0" stroke="#2c3444" stroke-width="5"/>
    <rect x="-72" y="-59" width="144" height="70" rx="34" fill="#1a2233"/>

    <!-- Visor Eyes Lens (Purple/Magenta) -->
    <!-- Left Eye -->
    <ellipse cx="-36" cy="-24" rx="30" ry="30" fill="#220033" stroke="#9c27b0" stroke-width="4"/>
    <ellipse cx="-36" cy="-24" rx="24" ry="24" fill="#6a1b9a"/>
    <!-- Iris & Glow -->
    <circle cx="-36" cy="-24" r="16" fill="#ab47bc"/>
    <circle cx="-42" cy="-30" r="8" fill="#ffffff"/>
    <circle cx="-28" cy="-18" r="4" fill="#ffffff"/>

    <!-- Right Eye -->
    <ellipse cx="36" cy="-24" rx="30" ry="30" fill="#220033" stroke="#9c27b0" stroke-width="4"/>
    <ellipse cx="36" cy="-24" rx="24" ry="24" fill="#6a1b9a"/>
    <!-- Iris & Glow -->
    <circle cx="36" cy="-24" r="16" fill="#ab47bc"/>
    <circle cx="30" cy="-30" r="8" fill="#ffffff"/>
    <circle cx="44" cy="-18" r="4" fill="#ffffff"/>

    <!-- Visor bridge light reflection -->
    <line x1="-15" y1="-24" x2="15" y2="-24" stroke="#80d8ff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Title: COSMIC RUSH -->
  <!-- 3D Bevel Shadow Behind Title -->
  <g transform="translate(540, 310) skewX(-10)">
    <!-- COSMIC -->
    <text x="0" y="0" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="#0d1130" text-anchor="middle" stroke="#001144" stroke-width="16" stroke-linejoin="round">COSMIC</text>
    <text x="-4" y="-4" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="#00f0ff" text-anchor="middle" stroke="#00f0ff" stroke-width="8" stroke-linejoin="round" filter="url(#glowFilter)">COSMIC</text>
    <text x="-4" y="-4" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="url(#cosmicGrad)" text-anchor="middle">COSMIC</text>
    <text x="-4" y="-4" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="82" fill="none" stroke="#ffffff" stroke-width="2" text-anchor="middle">COSMIC</text>

    <!-- Speed streaks on RUSH -->
    <line x1="80" y1="65" x2="280" y2="65" stroke="#ff5500" stroke-width="6" stroke-linecap="round" opacity="0.75" filter="url(#glowFilter)"/>
    <line x1="110" y1="45" x2="320" y2="45" stroke="#ffd700" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="140" y1="85" x2="260" y2="85" stroke="#ff2200" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

    <!-- RUSH -->
    <text x="20" y="75" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="96" fill="#330000" text-anchor="middle" stroke="#220000" stroke-width="18" stroke-linejoin="round">RUSH</text>
    <text x="16" y="71" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="96" fill="#ff5500" text-anchor="middle" stroke="#ff3300" stroke-width="10" stroke-linejoin="round" filter="url(#glowFilter)">RUSH</text>
    <text x="16" y="71" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="96" fill="url(#rushGrad)" text-anchor="middle">RUSH</text>
    <text x="16" y="71" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="96" fill="none" stroke="#fff8a6" stroke-width="2.5" text-anchor="middle">RUSH</text>
  </g>

  <!-- 5 Comic/Arcade Buttons Rendered Directly On Artwork -->
  <!-- 1. INICIAR SESIÓN (Top-Right) -->
  <g transform="translate(1015, 26)">
    <!-- Button Shadow & Frame -->
    <rect x="0" y="4" width="238" height="58" rx="14" fill="#b8782a"/>
    <rect x="0" y="0" width="238" height="58" rx="14" fill="url(#btnParchment)" stroke="#191208" stroke-width="4"/>
    <!-- User Icon Silhouette -->
    <circle cx="36" cy="24" r="8" fill="#191208"/>
    <path d="M 20,44 C 20,33 26,31 36,31 C 46,31 52,33 52,44 Z" fill="#191208"/>
    <!-- Text -->
    <text x="136" y="37" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#191208" text-anchor="middle" letter-spacing="1">INICIAR SESIÓN</text>
  </g>

  <!-- 2. HISTORIA (Right Stack, Top) -->
  <g transform="translate(985, 412)">
    <rect x="0" y="5" width="262" height="80" rx="16" fill="#b8782a"/>
    <rect x="0" y="0" width="262" height="80" rx="16" fill="url(#btnParchment)" stroke="#191208" stroke-width="5"/>
    <text x="131" y="54" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="42" fill="#191208" text-anchor="middle" letter-spacing="2">HISTORIA</text>
  </g>

  <!-- 3. INFINITO (Right Stack, Middle) -->
  <g transform="translate(985, 516)">
    <rect x="0" y="5" width="262" height="80" rx="16" fill="#b8782a"/>
    <rect x="0" y="0" width="262" height="80" rx="16" fill="url(#btnParchment)" stroke="#191208" stroke-width="5"/>
    <text x="131" y="54" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="42" fill="#191208" text-anchor="middle" letter-spacing="2">INFINITO</text>
  </g>

  <!-- 4. RANKING (Right Stack, Bottom) -->
  <g transform="translate(985, 620)">
    <rect x="0" y="5" width="262" height="80" rx="16" fill="#b8782a"/>
    <rect x="0" y="0" width="262" height="80" rx="16" fill="url(#btnParchment)" stroke="#191208" stroke-width="5"/>
    <text x="131" y="54" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="42" fill="#191208" text-anchor="middle" letter-spacing="2">RANKING</text>
  </g>

  <!-- 5. INSERTAR CÓDIGO (Bottom-Left) -->
  <g transform="translate(38, 634)">
    <rect x="0" y="5" width="268" height="62" rx="14" fill="#b8782a"/>
    <rect x="0" y="0" width="268" height="62" rx="14" fill="url(#btnParchment)" stroke="#191208" stroke-width="4.5"/>
    <text x="134" y="41" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="27" fill="#191208" text-anchor="middle" letter-spacing="1">INSERTAR CÓDIGO</text>
  </g>
</svg>